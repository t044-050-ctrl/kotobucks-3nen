<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ことばっくす！　３年生</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tone.js (効果音生成) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <!-- html2canvas (合格証の画像保存) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- Google Fonts: 丸ゴシック体 & 賞状用フォント -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@700&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet" />

  <style>
    /* 長押しメニュー・ダブルタップ拡大・文字選択を防止 */
    * {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* 全体フォントと操作性の最適化（３・４年生向けの明るいクリームイエロー＆アンバー基調） */
    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background: linear-gradient(135deg, #fefce8 0%, #fef9c3 50%, #fef3c7 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 賞状タイトル用フォント */
    .font-certificate {
      font-family: 'Kaisei Decol', 'M PLUS Rounded 1c', serif;
    }

    /* 画面切り替えフェードアニメーション */
    .fade-view {
      animation: fadeIn 0.35s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 正誤フィードバックの拡大ポップアニメーション */
    @keyframes markPop {
      0% {
        opacity: 0;
        transform: scale(0.4);
      }
      55% {
        opacity: 1;
        transform: scale(1.12);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .animate-mark-pop {
      animation: markPop 0.32s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* タップで開くカードのスタイル */
    .reveal-box {
      transition: all 0.25s ease;
    }
    .reveal-box:active {
      transform: scale(0.97);
    }

    /* 合格証の和風ゴールドフレーム */
    .certificate-frame {
      background: radial-gradient(circle at center, #fffdf7 0%, #fef9e7 100%);
      border: 8px double #d97706;
      box-shadow: inset 0 0 0 4px #fde68a, 0 12px 30px rgba(180, 83, 9, 0.18);
    }

    /* 紙吹雪アニメーション */
    @keyframes confettiFall {
      0% {
        transform: translateY(-20px) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(420px) rotate(720deg);
        opacity: 0;
      }
    }

    .confetti-piece {
      position: absolute;
      top: -10px;
      width: 10px;
      height: 16px;
      border-radius: 3px;
      animation: confettiFall linear infinite;
      pointer-events: none;
    }

    /* スマホ風キーボードのフリックポップアップ */
    .flick-bubble {
      position: absolute;
      z-index: 60;
      pointer-events: none;
      transform: translate(-50%, -115%);
    }
  </style>
</head>
<body class="flex items-center justify-center p-2 sm:p-3 md:p-4">

  <!-- メインコンテナ（横幅を広げ、16:9画面比に収まるよう調整） -->
  <div id="app-container" class="relative w-full max-w-6xl bg-[#fffef9] border-4 border-yellow-400 rounded-3xl shadow-2xl overflow-hidden flex flex-col min-h-[480px] lg:min-h-[540px]">

    <!-- 上部共通ヘッダーバー -->
    <header class="flex items-center justify-between px-4 py-2.5 bg-yellow-100 border-b-2 border-yellow-300 gap-2">
      <div class="flex items-center gap-2">
        <!-- トップへ戻るボタン（トップ画面以外で表示） -->
        <button id="btn-home" type="button" onclick="goHome()"
          class="hidden items-center gap-1 px-3 py-1.5 rounded-2xl bg-amber-50 border-2 border-amber-300 text-amber-950 font-bold text-xs sm:text-sm shadow-sm hover:bg-amber-200/70 active:scale-95 transition">
          <span>🏠</span>
          <span>さいしょへ</span>
        </button>
      </div>

      <!-- 現在の学年・単元表示バッジ -->
      <div id="header-status" class="text-right ml-auto">
        <span class="inline-block px-3 py-1 rounded-full bg-yellow-300 text-amber-950 font-bold text-xs sm:text-sm">

        </span>
      </div>
    </header>

    <!-- メインコンテンツ描画エリア -->
    <main id="screen-root" class="flex-1 flex flex-col justify-between p-3 sm:p-5 md:p-6 relative">
      <!-- JavaScriptで各画面を描画 -->
    </main>

    <!-- カスタム通知トースト（alertの代替） -->
    <div id="toast-box" class="hidden fixed bottom-14 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-2xl bg-amber-950 text-yellow-50 font-bold text-sm shadow-xl transition-opacity duration-300">
    </div>
  </div>

  <!-- 消音トグルボタン（画面右下へ配置） -->
  <button id="btn-mute" type="button" onclick="toggleMute()"
    class="fixed bottom-3 right-3 z-40 flex items-center gap-1.5 px-3.5 py-2 rounded-full bg-white/95 border-2 border-yellow-400 text-amber-950 font-bold text-xs sm:text-sm shadow-lg hover:bg-yellow-50 active:scale-95 transition">
    <span id="mute-icon" class="text-base sm:text-lg">🔊</span>
    <span id="mute-label">おと ON</span>
  </button>

  <!-- スマホ風文字入力パネル（モーダル） -->
  <div id="kana-keyboard-modal" class="hidden fixed inset-0 z-50 bg-black/40 flex items-end sm:items-center justify-center p-2 sm:p-4">
    <!-- JavaScriptでキーボードを描画 -->
  </div>

  <script>
    /* =========================================================================
       1. 効果音（Tone.js）・消音切り替え・通知トースト機能
       ========================================================================= */
    let isMuted = false;
    let soundSynth = null;
    let toastTimer = null;

    // オーディオ初期化（初回操作時にTone.jsを起動）
    function initAudioEngine() {
      try {
        if (typeof Tone === 'undefined') return null;
        if (Tone.context && Tone.context.state !== 'running') {
          Tone.start();
        }
        if (!soundSynth) {
          soundSynth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: 'triangle' },
            envelope: { attack: 0.01, decay: 0.15, sustain: 0.1, release: 0.3 }
          }).toDestination();
          soundSynth.volume.value = -8;
        }
        return soundSynth;
      } catch (e) {
        console.warn('Audio init skipped:', e);
        return null;
      }
    }

    // 効果音再生（tap / correct / wrong / clear）
    function playSound(type) {
      if (isMuted) return;
      try {
        const synth = initAudioEngine();
        if (!synth) return;
        const now = Tone.now();

        if (type === 'tap') {
          synth.triggerAttackRelease('G5', '32n', now);
        } else if (type === 'correct') {
          synth.triggerAttackRelease('E5', '16n', now);
          synth.triggerAttackRelease('G5', '16n', now + 0.09);
          synth.triggerAttackRelease('C6', '8n', now + 0.18);
        } else if (type === 'wrong') {
          synth.triggerAttackRelease('F3', '16n', now);
          synth.triggerAttackRelease('E3', '8n', now + 0.12);
        } else if (type === 'clear') {
          synth.triggerAttackRelease('C5', '16n', now);
          synth.triggerAttackRelease('E5', '16n', now + 0.1);
          synth.triggerAttackRelease('G5', '16n', now + 0.2);
          synth.triggerAttackRelease('C6', '4n', now + 0.3);
        }
      } catch (e) {
        console.warn('Sound playback skipped:', e);
      }
    }

    // 右下の消音ボタン切り替え
    function toggleMute() {
      isMuted = !isMuted;
      const iconEl = document.getElementById('mute-icon');
      const labelEl = document.getElementById('mute-label');
      if (iconEl) iconEl.textContent = isMuted ? '🔇' : '🔊';
      if (labelEl) labelEl.textContent = isMuted ? 'おと OFF' : 'おと ON';
      if (!isMuted) {
        playSound('tap');
      }
    }

    // 画面下部のメッセージ通知表示
    function showToast(message) {
      const box = document.getElementById('toast-box');
      if (!box) return;
      box.textContent = message;
      box.classList.remove('hidden');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        box.classList.add('hidden');
      }, 2600);
    }

    /* =========================================================================

          計30問をすべて異なる問題で構成
       ========================================================================= */

              { q: '「かさ」「かに」「かめ」のうち、国語じてんで一番さいしょにのっているのはどれ？', c: ['かさ', 'かに', 'かめ'], a: 'かさ', exp: '1文字目が同じ「か」なので、2文字目の「さ・に・め」をくらべます。' },
              { q: '「ふうせん」と「ぶどう」では、国語じてんでどちらが先にのっている？', c: ['ふうせん', 'ぶどう', 'まったく同じ場所'], a: 'ふうせん', exp: '濁点（゛）や半濁点（゜）のない清音（ふ）が先にのります。' },
              { q: '「走った」という言葉を国語じてんで調べるとき、どの形でさがす？', c: ['走る', '走り', '走って'], a: '走る', exp: '動く言葉は「〜う・〜く・〜る」などの言い切りの形でのっています。' },
              { q: '「うれしかった」を国語じてんで調べるとき、どの形でさがす？', c: ['うれしい', 'うれしく', 'うれしさ'], a: 'うれしい', exp: '様子を表す言葉は「〜い」で言い切る形（うれしい）でのっています。' },
              { q: '「おさら」と「おっさん」のように小さい「っ」があるとき、どちらが先にのる？', c: ['おさら', 'おっさん', 'どちらでもよい'], a: 'おさら', exp: '2文字目が「さ」と「っ（つ）」なので、「さ」の「おさら」が先です。' },
              { q: '「ケーキ」や「ノート」のようにのばす音「ー」がある言葉は、どうやってならぶ？', c: ['前の音の母音（あいうえお）におきかえてならぶ', '五十音のいちばん最後にならぶ', '「ー」をぬかしてならぶ'], a: '前の音の母音（あいうえお）におきかえてならぶ', exp: '「ノート」なら「のおと」のじゅんでさがします。' },
              { q: '国語じてんで、言葉の意味を説明するときに太い文字で書かれている最初の言葉を何という？', c: ['見出し語', 'はしら', 'つめ'], a: '見出し語', exp: '見出し語が太字で書かれ、そのあとに意味や使い方がのっています。' }

            stage1: [
              { q: '次の３つの言葉のうち、国語じてんで一番さいしょにのっているのはどれ？', c: ['いぬ', 'うさぎ', 'えほん'], a: 'いぬ', exp: '「い・う・え」のじゅんなので「いぬ」が一番先です。' },

    /* =========================================================================
       4. ヘルパー関数（単元取得・問題生成）
       ========================================================================= */
    function getSelectedUnitData() {
      const gradeObj = CURRICULUM[state.selectedGrade];
      if (state.selectedUnitId === `mix-${state.selectedGrade}`) {
        const allMinna = [];
        const allS1 = [];
        const allS2 = [];
        gradeObj.units.forEach(u => {
          allMinna.push(...u.minnaQuestions.map(q => ({ ...q, unitTitle: u.title })));
          allS1.push(...u.stage1.map(q => ({ ...q, unitTitle: u.title })));
          allS2.push(...u.stage2.map(q => ({ ...q, unitTitle: u.title })));
        });
        return {
          id: `mix-${state.selectedGrade}`,
          pages: '全単元',
          title: `${gradeObj.shortLabel} まとめ総合テスト`,
          subtitle: `${gradeObj.units.length}つの単元からランダムに出題！`,
          isMix: true,
          minnaQuestions: shuffleArray(allMinna).slice(0, 10),
          stage1: shuffleArray(allS1).slice(0, 10),
          stage2: shuffleArray(allS2).slice(0, 10)
        };
      }
      return gradeObj.units.find(u => u.id === state.selectedUnitId) || gradeObj.units[0];
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

          <span class="inline-block px-3 py-1 rounded-full bg-yellow-300 text-amber-950 font-bold text-xs sm:text-sm">
            ３年生 国語 言葉の学習
          </span>`;
      } else {
        btnHome.className = `flex items-center gap-1 px-3 py-1.5 rounded-2xl border-2 font-bold text-xs sm:text-sm shadow-sm active:scale-95 transition ${
          isGrade4
            ? 'bg-lime-50 border-lime-300 text-lime-950 hover:bg-lime-200/70'
            : 'bg-amber-50 border-amber-300 text-amber-950 hover:bg-amber-200/70'
        }`;
        headerStatus.innerHTML = `
          <span class="inline-block px-3 py-1 rounded-full bg-yellow-300 text-amber-950 font-bold text-xs sm:text-sm truncate max-w-[220px] sm:max-w-md">
            ${CURRICULUM[state.selectedGrade].shortLabel}｜${escapeHtml(unit.title)}
          </span>`;
      }
    }

    function goHome() {
      playSound('tap');
      if (state.minnaMarkTimer) {
        clearTimeout(state.minnaMarkTimer);
        state.minnaMarkTimer = null;
      }
      state.screen = 'home';
      state.answeringLocked = false;
      state.feedbackData = null;
      render();
    }

    /* =========================================================================
       5. 画面描画ルーティング＆各画面レンダラー
       ========================================================================= */
    function render() {
      updateHeader();
      const root = document.getElementById('screen-root');
      if (!root) return;
      root.scrollTop = 0;

      switch (state.screen) {
        case 'home':
          renderHome(root);
          break;
        case 'minna':
          renderMinna(root);
          break;
        case 'minna-done':
          renderMinnaDone(root);
          break;
        case 'hitori-menu':
          renderHitoriMenu(root);
          break;
        case 'quiz':
          renderQuiz(root);
          break;
        case 'stage-result':
          renderStageResult(root);
          break;
        case 'certificate':
          renderCertificate(root);
          break;
        default:
          state.screen = 'home';
          renderHome(root);
          break;
      }
    }

    /* -------------------------------------------------------------------------
       画面A: トップ画面（学年選択・単元選択・モード選択）
       ------------------------------------------------------------------------- */
    function renderHome(root) {
      const gradeObj = CURRICULUM[state.selectedGrade];
      const currentUnit = getSelectedUnitData();
      const isMixSelected = state.selectedUnitId === `mix-${state.selectedGrade}`;
      const isGrade4 = state.selectedGrade === 4;

      const unitButtonsHtml = gradeObj.units.map(u => {
        const isSelected = state.selectedUnitId === u.id;
        const btnClass = isGrade4
          ? (isSelected
              ? 'bg-lime-300 border-lime-500 text-lime-950 shadow-md ring-2 ring-lime-200'
              : 'bg-white border-lime-200 text-slate-800 hover:bg-lime-50')
          : (isSelected
              ? 'bg-amber-400 border-amber-600 text-amber-950 shadow-md ring-2 ring-yellow-300'
              : 'bg-white border-yellow-200 text-slate-800 hover:bg-yellow-50');
        const badgeClass = isGrade4
          ? (isSelected ? 'bg-white/70 text-lime-950' : 'bg-lime-100 text-lime-900')
          : (isSelected ? 'bg-white/60 text-amber-950' : 'bg-yellow-100 text-amber-900');

        return `
          <button type="button" onclick="selectUnit('${u.id}')"
            class="text-left p-2.5 rounded-2xl border-2 transition transform hover:scale-[1.02] active:scale-95 flex flex-col justify-start ${btnClass}">
            <div class="flex items-center justify-between gap-1 mb-0.5">
              <span class="text-[11px] font-bold px-2 py-0.5 rounded-full ${badgeClass}">${escapeHtml(u.pages)}</span>
            </div>
            <div class="font-extrabold text-sm sm:text-base leading-snug">${escapeHtml(u.title)}</div>
          </button>
        `;
      }).join('');

      const mixBtnClass = isGrade4
        ? (isMixSelected
            ? 'bg-lime-400 text-lime-950 border-lime-600 shadow'
            : 'bg-lime-100 text-lime-950 border-lime-300 hover:bg-lime-200')
        : (isMixSelected
            ? 'bg-orange-600 text-white border-orange-800 shadow'
            : 'bg-yellow-200 text-amber-950 border-yellow-400 hover:bg-yellow-300');

      const minnaBtnClass = isGrade4
        ? 'bg-lime-300 hover:bg-lime-400 text-lime-950 border-lime-500'
        : 'bg-orange-500 hover:bg-orange-600 text-white border-orange-700';

      const hitoriBtnClass = isGrade4
        ? 'bg-lime-200 hover:bg-lime-300 text-lime-950 border-lime-400'
        : 'bg-amber-500 hover:bg-amber-600 text-white border-amber-700';

      const hitoriSubClass = isGrade4 ? 'text-lime-900' : 'text-amber-50';

      root.innerHTML = `
        <div class="fade-view flex flex-col gap-3 my-auto">
          <!-- アプリタイトル -->
          <div class="text-center">
            <p class="text-xs sm:text-sm font-bold text-amber-800 tracking-wider">
              ３年生 言葉のきまり・知識
            </p>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-800 tracking-tight">
              ことばっくす！
            </h1>
          </div>

          <!-- STEP 1: 単元選択（縦幅をコンパクトにし16:9画面内に収める） -->
          <div class="bg-amber-50/60 p-2.5 sm:p-3 rounded-2xl border-2 border-yellow-200">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
              <div class="text-xs font-extrabold text-amber-950 flex items-center gap-1.5">
                <span class="px-2 py-0.5 rounded-md bg-amber-800 text-white">STEP 1</span>
                <span>学習する単元をえらぼう</span>
              </div>
              <button type="button" onclick="selectUnit('mix-${state.selectedGrade}')"
                class="text-xs sm:text-sm font-extrabold px-3 py-1 rounded-xl border-2 transition active:scale-95 ${mixBtnClass}">
                🌟 ${gradeObj.shortLabel} まとめ総合テスト
              </button>
            </div>

            <div id="unit-scroll-list" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2 pr-1">
              ${unitButtonsHtml}
            </div>
          </div>

          <!-- STEP 3: 学習モード選択ボタン -->
          <div class="bg-yellow-100/80 p-2.5 sm:p-3 rounded-2xl border-2 border-yellow-300">
            <div class="text-center mb-2">
              <span class="text-xs font-bold text-amber-900">えらんだ単元：</span>
              <span class="text-sm sm:text-base font-extrabold text-slate-900 underline decoration-amber-400 decoration-4">
                ${escapeHtml(currentUnit.title)}
              </span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              <!-- みんなで学習（テレビ提示用） -->
              <button type="button" onclick="startMinna()"
                class="py-3 px-5 rounded-2xl ${minnaBtnClass} font-extrabold text-lg sm:text-xl shadow-lg border-b-4 transition transform hover:scale-[1.02] active:scale-95 flex flex-col items-center justify-center gap-0.5">
                <span class="flex items-center gap-2">
                  <span>📺</span>
                  <span>みんなで学習</span>
                </span>
                <span class="text-xs font-bold opacity-95">
                  テレビにうつして みんなで学習！
                </span>
              </button>

              <!-- ひとりで挑戦（児童用クイズ） -->
              <button type="button" onclick="openHitoriMenu()"
                class="py-3 px-5 rounded-2xl ${hitoriBtnClass} font-extrabold text-lg sm:text-xl shadow-lg border-b-4 transition transform hover:scale-[1.02] active:scale-95 flex flex-col items-center justify-center gap-0.5">
                <span class="flex items-center gap-2">
                  <span>✏️</span>
                  <span>ひとりで挑戦</span>
                </span>
                <span class="text-xs font-bold ${hitoriSubClass}">
                  ステージクリアで 合格証をゲット！
                </span>
              </button>
            </div>
          </div>
        </div>
      `;

      // 単元一覧のスクロール位置を復元（選んだ単元ボタンを表示したままにする）
      const unitScrollList = document.getElementById('unit-scroll-list');
      if (unitScrollList) {
        unitScrollList.scrollTop = state.unitListScrollTop || 0;
      }
    }

    function selectGrade(grade) {
      playSound('tap');
      state.selectedGrade = grade;
      state.selectedUnitId = CURRICULUM[grade].units[0].id;
      state.unitListScrollTop = 0;
      render();
    }

    function selectUnit(unitId) {
      playSound('tap');
      const unitScrollList = document.getElementById('unit-scroll-list');
      if (unitScrollList) {
        state.unitListScrollTop = unitScrollList.scrollTop;
      }
      state.selectedUnitId = unitId;
      render();
    }

    /* -------------------------------------------------------------------------
       画面B: 「みんなで学習」モード（大型テレビ提示・①②③ナンバリング3択形式）
       ------------------------------------------------------------------------- */
    function startMinna() {
      const unit = getSelectedUnitData();
      playSound('tap');

      if (state.minnaMarkTimer) {
        clearTimeout(state.minnaMarkTimer);
        state.minnaMarkTimer = null;
      }

      // 「みんなで学習」専用の10問を出題リストにする（ステージ1・2とはすべて別の問題）
      const source = unit.minnaQuestions;
      state.minnaQueue = source.map(q => ({
        ...q,
        _shuffledChoices: shuffleArray(q.c)
      }));
      state.minnaIndex = 0;
      state.minnaAnswered = false;
      state.minnaSelectedChoice = null;
      state.minnaShowMark = false;
      state.screen = 'minna';
      render();
    }

    function selectMinnaAnswer(choiceIndex) {
      if (state.minnaAnswered) return;
      const currentQ = state.minnaQueue[state.minnaIndex];
      const selectedChoice = currentQ._shuffledChoices[choiceIndex];
      const isCorrect = selectedChoice === currentQ.a;

      state.minnaAnswered = true;
      state.minnaSelectedChoice = selectedChoice;
      state.minnaShowMark = isCorrect;

      if (isCorrect) {
        playSound('correct');
      } else {
        playSound('wrong');
      }

      render();
    }

    // 「みんなで学習」で次の問題または完了画面へ進む処理
    function nextMinnaQuestion() {
      playSound('tap');
      if (state.minnaMarkTimer) {
        clearTimeout(state.minnaMarkTimer);
        state.minnaMarkTimer = null;
      }

      if (state.minnaIndex + 1 < state.minnaQueue.length) {
        state.minnaIndex++;
        state.minnaAnswered = false;
        state.minnaSelectedChoice = null;
        state.minnaShowMark = false;
        render();
      } else {
        playSound('clear');
        state.screen = 'minna-done';
        render();
      }
    }

    function renderMinna(root) {
      const unit = getSelectedUnitData();
      const currentQ = state.minnaQueue[state.minnaIndex];
      const total = state.minnaQueue.length;
      const numBadges = ['①', '②', '③'];
      const isGrade4 = state.selectedGrade === 4;

      if (!currentQ._shuffledChoices) {
        currentQ._shuffledChoices = shuffleArray(currentQ.c);
      }

      const isCorrect = state.minnaAnswered && state.minnaSelectedChoice === currentQ.a;

      root.innerHTML = `
        <div class="fade-view flex flex-col justify-between flex-1 gap-4 relative">
          <!-- 上部ステータス -->
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-2">
              <span class="px-3 py-1 rounded-full bg-orange-500 text-white font-extrabold text-xs sm:text-sm">
                📺 みんなで学習
              </span>
              ${currentQ.unitTitle ? `<span class="text-xs font-bold text-orange-800">[${escapeHtml(currentQ.unitTitle)}]</span>` : ''}
            </div>

            <div class="flex items-center gap-2">
              <span class="px-3.5 py-1 rounded-full bg-orange-100 border-2 border-orange-300 text-orange-950 font-extrabold text-sm">
                もんだい ${state.minnaIndex + 1} / ${total}
              </span>
              <button type="button" onclick="goHome()"
                class="px-3 py-1 rounded-xl font-bold text-xs ${
                  isGrade4 ? 'bg-lime-100 hover:bg-lime-200 text-lime-950' : 'bg-amber-100 hover:bg-amber-200 text-amber-950'
                }">
                おわる
              </button>
            </div>
          </div>

          <!-- 問題文ボックス -->
          <div class="my-auto p-5 sm:p-7 rounded-3xl bg-orange-50/70 border-4 border-orange-300 shadow-inner text-center relative">
            <!-- 正解カプセル（正解時に中央上部へ表示） -->
            ${state.minnaAnswered && isCorrect ? `
              <div class="animate-mark-pop inline-flex items-center gap-2 px-4 py-1 rounded-full mb-2 font-extrabold text-base sm:text-lg shadow bg-amber-400 text-amber-950 border-2 border-amber-600">
                <span class="text-2xl leading-none">○</span>
                <span>大正かい！</span>
              </div>
            ` : ''}

            <!-- 不正解カプセル（誤答時に中央上部へ表示） -->
            ${state.minnaAnswered && !isCorrect ? `
              <div class="animate-mark-pop inline-flex items-center gap-2 px-4 py-1 rounded-full mb-2 font-extrabold text-base sm:text-lg shadow bg-rose-500 text-white border-2 border-rose-700">
                <span class="text-2xl leading-none">×</span>
                <span>おしい！正かいを かくにんしよう</span>
              </div>
            ` : ''}

            <p class="text-lg sm:text-2xl md:text-3xl font-extrabold text-slate-800 leading-relaxed whitespace-pre-line">
              ${formatQuestionText(currentQ.q)}
            </p>
          </div>

          <!-- ① ② ③ ナンバリング付き選択肢ボタン -->
          <div class="grid grid-cols-1 gap-2.5 sm:gap-3">
            ${currentQ._shuffledChoices.map((choice, cIdx) => {
              const numLabel = numBadges[cIdx] || `${cIdx + 1}.`;
              let btnStyle = isGrade4
                ? 'bg-white hover:bg-lime-50 border-lime-300 text-slate-800'
                : 'bg-white hover:bg-orange-50 border-orange-300 text-slate-800';
              let numColor = isGrade4 ? 'text-lime-700' : 'text-orange-600';

              if (state.minnaAnswered) {
                if (choice === currentQ.a) {
                  btnStyle = isGrade4
                    ? 'bg-lime-300 border-lime-500 text-lime-950'
                    : 'bg-amber-400 border-amber-600 text-amber-950';
                  numColor = isGrade4 ? 'text-lime-950' : 'text-amber-950';
                } else {
                  btnStyle = 'bg-slate-100 border-slate-200 text-slate-400';
                  numColor = 'text-slate-400';
                }
              }

              return `
                <button type="button" onclick="selectMinnaAnswer(${cIdx})"
                  ${state.minnaAnswered ? 'disabled' : ''}
                  class="w-full py-3.5 sm:py-4 px-5 rounded-2xl border-4 font-extrabold text-base sm:text-xl md:text-2xl shadow-md transition transform active:scale-95 flex items-center justify-center gap-2.5 ${btnStyle}">
                  <span class="${numColor} text-xl sm:text-2xl md:text-3xl font-extrabold shrink-0">${numLabel}</span>
                  <span>${escapeHtml(choice)}</span>
                </button>
              `;
            }).join('')}
          </div>

          <!-- 下部ガイド・解説＆「つぎへ」ボタンエリア -->
          <div class="pt-2 border-t-2 border-yellow-200 min-h-[64px] flex items-center justify-center">
            ${state.minnaAnswered ? `
              <div class="w-full flex flex-col sm:flex-row items-center justify-between gap-3 p-3 rounded-2xl border-2 fade-view ${
                isCorrect
                  ? 'bg-yellow-100 border-amber-500 text-amber-950'
                  : 'bg-amber-50 border-amber-400 text-amber-950'
              }">
                <div class="text-xs sm:text-sm md:text-base font-bold text-left flex-1">
                  <span class="font-extrabold mr-1.5">${isCorrect ? '正かい！' : `正解は「${escapeHtml(currentQ.a)}」です。`}</span>
                  <span>${escapeHtml(currentQ.exp)}</span>
                </div>
                <button type="button" onclick="nextMinnaQuestion()"
                  class="shrink-0 py-2.5 px-6 rounded-2xl font-extrabold text-base sm:text-lg shadow-md border-b-4 transition transform hover:scale-105 active:scale-95 ${
                    isGrade4
                      ? 'bg-lime-300 hover:bg-lime-400 text-lime-950 border-lime-500'
                      : 'bg-emerald-500 hover:bg-emerald-600 text-white border-emerald-700'
                  }">
                  ${state.minnaIndex + 1 < total ? 'つぎへ ▶' : '学習のまとめへ ▶'}
                </button>
              </div>
            ` : `
              <p class="text-xs sm:text-sm font-bold text-orange-800 text-center">
                みんなで 考えて、正しい ものを えらぼう！（えらぶと かいせつと 「つぎへ」ボタンが 出ます）
              </p>
            `}
          </div>
        </div>
      `;
    }

    /* -------------------------------------------------------------------------
       画面C: 「みんなで学習」完了画面
       ------------------------------------------------------------------------- */
    function renderMinnaDone(root) {
      const unit = getSelectedUnitData();
      const isGrade4 = state.selectedGrade === 4;
      root.innerHTML = `
        <div class="fade-view flex flex-col items-center justify-center text-center my-auto gap-5 py-4">
          <div class="text-5xl sm:text-6xl">🎉</div>
          <div>
            <h2 class="text-3xl sm:text-4xl font-extrabold text-orange-600 mb-2">よくできました！</h2>
            <p class="text-base sm:text-lg font-bold text-slate-700">
              「${escapeHtml(unit.title)}」のポイント確認がおわりました。
            </p>
            <p class="text-sm font-bold text-amber-800 mt-1">
              つぎは「ひとりで挑戦」で 合格証をめざそう！
            </p>
          </div>

          <div class="flex flex-col sm:flex-row gap-3 w-full max-w-lg mt-2">
            <button type="button" onclick="startMinna()"
              class="flex-1 py-3.5 px-5 rounded-2xl font-extrabold text-base sm:text-lg shadow-md border-b-4 transition active:scale-95 ${
                isGrade4
                  ? 'bg-lime-200 hover:bg-lime-300 text-lime-950 border-lime-400'
                  : 'bg-orange-500 hover:bg-orange-600 text-white border-orange-700'
              }">
              🔄 もういちど見る
            </button>
            <button type="button" onclick="openHitoriMenu()"
              class="flex-1 py-3.5 px-5 rounded-2xl font-extrabold text-base sm:text-lg shadow-md border-b-4 transition transform hover:scale-105 active:scale-95 ${
                isGrade4
                  ? 'bg-lime-300 hover:bg-lime-400 text-lime-950 border-lime-500'
                  : 'bg-amber-500 hover:bg-amber-600 text-white border-amber-700'
              }">
              ✏️ ひとりで挑戦へ！
            </button>
          </div>
        </div>
      `;
    }

    /* -------------------------------------------------------------------------
       画面D: 「ひとりで挑戦」ステージ選択画面
       ------------------------------------------------------------------------- */
    function openHitoriMenu() {
      playSound('tap');
      state.screen = 'hitori-menu';
      state.stage1Passed = false;
      state.stage2Passed = false;
      render();
    }

    function startQuizStage(stageNum, retryQuestions = null) {
      playSound('tap');
      const unit = getSelectedUnitData();
      state.currentStage = stageNum;
      state.screen = 'quiz';
      state.quizIndex = 0;
      state.missedList = [];
      state.answeringLocked = false;
      state.feedbackData = null;

      let rawList = [];
      if (retryQuestions && retryQuestions.length > 0) {
        state.isRetryRun = true;
        rawList = shuffleArray(retryQuestions);
      } else {
        state.isRetryRun = false;
        const source = stageNum === 1 ? unit.stage1 : unit.stage2;
        rawList = shuffleArray(source);
      }

      // ステージ開始時に選択肢の並び順を確定（回答中に選択肢が移動しないようにする）
      state.quizQueue = rawList.map(q => ({
        ...q,
        _shuffledChoices: shuffleArray(q.c)
      }));

      render();
    }

    function renderHitoriMenu(root) {
      const unit = getSelectedUnitData();
      const isGrade4 = state.selectedGrade === 4;
      root.innerHTML = `
        <div class="fade-view flex flex-col items-center justify-center text-center my-auto gap-5">
          <div>
            <span class="inline-block px-3 py-1 rounded-full bg-yellow-300 text-amber-950 font-extrabold text-xs sm:text-sm mb-2">
              ✏️ ひとりで挑戦
            </span>
            <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-800">${escapeHtml(unit.title)}</h2>
            <p class="text-sm sm:text-base font-bold text-slate-600 mt-1">
              ステージ１・ステージ２を 全問正解すると「合格証」が もらえるよ！
            </p>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 w-full max-w-xl">
            <button type="button" onclick="startQuizStage(1)"
              class="p-5 rounded-3xl font-extrabold shadow-lg border-b-4 transition transform hover:scale-105 active:scale-95 flex flex-col items-center gap-1.5 ${
                isGrade4
                  ? 'bg-lime-200 hover:bg-lime-300 text-lime-950 border-lime-400'
                  : 'bg-amber-400 hover:bg-amber-500 text-amber-950 border-amber-600'
              }">
              <span class="text-xs bg-white/70 px-3 py-0.5 rounded-full">きほん編（${unit.stage1.length}問）</span>
              <span class="text-2xl">ステージ １</span>
              <span class="text-xs font-bold">${state.stage1Passed ? '✅ クリアずみ！' : 'まずはここからスタート！'}</span>
            </button>

            <button type="button" onclick="startQuizStage(2)"
              class="p-5 rounded-3xl font-extrabold shadow-lg border-b-4 transition transform hover:scale-105 active:scale-95 flex flex-col items-center gap-1.5 ${
                isGrade4
                  ? 'bg-lime-300 hover:bg-lime-400 text-lime-950 border-lime-500'
                  : 'bg-orange-500 hover:bg-orange-600 text-white border-orange-700'
              }">
              <span class="text-xs ${isGrade4 ? 'bg-white/70' : 'bg-white/25'} px-3 py-0.5 rounded-full">ちょうせん編（${unit.stage2.length}問）</span>
              <span class="text-2xl">ステージ ２</span>
              <span class="text-xs font-bold opacity-95">${state.stage2Passed ? '✅ クリアずみ！' : 'レベルアップ問題に挑戦！'}</span>
            </button>
          </div>

          <button type="button" onclick="goHome()"
            class="mt-2 py-2.5 px-6 rounded-2xl font-bold text-sm transition ${
              isGrade4 ? 'bg-lime-100 hover:bg-lime-200 text-lime-950' : 'bg-amber-100 hover:bg-amber-200 text-amber-950'
            }">
            ◀ 単元えらびにもどる
          </button>
        </div>
      `;
    }

    /* -------------------------------------------------------------------------
       画面E: クイズ出題・正誤判定画面
       ------------------------------------------------------------------------- */
    function renderQuiz(root) {
      const currentQ = state.quizQueue[state.quizIndex];
      const total = state.quizQueue.length;
      const isGrade4 = state.selectedGrade === 4;

      if (!currentQ._shuffledChoices) {
        currentQ._shuffledChoices = shuffleArray(currentQ.c);
      }

      root.innerHTML = `
        <div class="fade-view flex flex-col justify-between flex-1 gap-4 relative">
          <!-- 上部ステータス -->
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-2">

              </span>
              ${currentQ.unitTitle ? `<span class="text-xs font-bold text-amber-800">[${escapeHtml(currentQ.unitTitle)}]</span>` : ''}
            </div>

            <div class="flex items-center gap-2">
              <span class="px-3.5 py-1 rounded-full bg-yellow-100 border-2 border-yellow-400 text-amber-950 font-extrabold text-sm">
                もんだい ${state.quizIndex + 1} / ${total}
              </span>
              <button type="button" onclick="openHitoriMenu()"
                class="px-3 py-1 rounded-xl font-bold text-xs ${

                }">

          <!-- 問題文ボックス -->
          <div class="my-auto p-5 sm:p-7 rounded-3xl bg-yellow-50 border-4 border-yellow-400 shadow-inner text-center relative overflow-hidden">
            <!-- 正解時の大きな「○」オーバーレイ -->
            ${state.feedbackData && state.feedbackData.isCorrect ? `
              <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-10">
                <span class="animate-mark-pop inline-block w-24 h-24 sm:w-28 sm:h-28 rounded-full border-[7px] sm:border-[8px] border-amber-500" aria-label="正解"></span>
              </div>
            ` : ''}

            <!-- 不正解時の大きな「×」オーバーレイ -->
            ${state.feedbackData && !state.feedbackData.isCorrect ? `
              <div class="absolute inset-0 bg-white/85 rounded-2xl flex items-center justify-center pointer-events-none z-10">
                <span class="animate-mark-pop text-8xl sm:text-9xl font-extrabold text-rose-500 leading-none select-none" aria-label="不正解">×</span>
              </div>

            <p class="text-lg sm:text-2xl font-extrabold text-slate-800 leading-relaxed whitespace-pre-line transition-opacity duration-200 ${
              state.feedbackData && state.feedbackData.isCorrect ? 'opacity-25' : ''
            }">
              ${formatQuestionText(currentQ.q)}
            </p>
          </div>

          <!-- 解説メッセージ（回答後に表示） -->
          <div class="min-h-[54px] flex items-center justify-center">
            ${state.feedbackData ? `
              <div class="w-full p-3 rounded-2xl border-2 font-bold text-xs sm:text-sm text-center fade-view ${
                state.feedbackData.isCorrect

                  : 'bg-amber-50 border-amber-400 text-amber-950'
              }">
                <span class="font-extrabold mr-1">${state.feedbackData.isCorrect ? 'せいかい！' : `正解は「${escapeHtml(currentQ.a)}」です。`}</span>
                <span>${escapeHtml(state.feedbackData.exp)}</span>
              </div>
            ` : `
              <p class="text-xs sm:text-sm font-bold text-amber-900">下から正しいものを １つえらぼう！</p>
            `}
          </div>

          <!-- 選択肢ボタン（回答後も位置が移動しない） -->
          <div class="grid grid-cols-1 gap-3">
            ${currentQ._shuffledChoices.map((choice, cIdx) => {
              let btnStyle = isGrade4
                ? 'bg-white hover:bg-lime-50 border-lime-300 text-slate-800'
                : 'bg-white hover:bg-yellow-50 border-yellow-300 text-slate-800';
              if (state.feedbackData) {
                if (choice === currentQ.a) {
                  btnStyle = isGrade4
                    ? 'bg-lime-300 border-lime-500 text-lime-950'
                    : 'bg-amber-400 border-amber-600 text-amber-950';
                } else {
                  btnStyle = 'bg-slate-100 border-slate-200 text-slate-400';
                }
              }
              return `
                <button type="button" onclick="submitAnswerByIndex(${cIdx})"
                  ${state.answeringLocked ? 'disabled' : ''}
                  class="w-full py-3.5 sm:py-4 px-5 rounded-2xl border-4 font-extrabold text-base sm:text-xl shadow-md transition transform active:scale-95 ${btnStyle}">
                  ${escapeHtml(choice)}
                </button>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function submitAnswerByIndex(choiceIndex) {
      if (state.answeringLocked) return;
      const currentQ = state.quizQueue[state.quizIndex];
      const selectedChoice = currentQ._shuffledChoices[choiceIndex];
      submitAnswer(selectedChoice);
    }

    function submitAnswer(selectedChoice) {
      if (state.answeringLocked) return;
      state.answeringLocked = true;

      const currentQ = state.quizQueue[state.quizIndex];
      const isCorrect = selectedChoice === currentQ.a;

      if (isCorrect) {
        playSound('correct');
      } else {
        playSound('wrong');
        state.missedList.push(currentQ);
      }

      state.feedbackData = {
        isCorrect,
        exp: currentQ.exp
      };
      render();

      // 解説を読む時間を確保してから自動で次へ進む
      setTimeout(() => {
        state.feedbackData = null;
        state.answeringLocked = false;
        if (state.quizIndex + 1 < state.quizQueue.length) {
          state.quizIndex++;
          render();
        } else {
          finishStage();
        }
      }, isCorrect ? 1300 : 2100);
    }

    function finishStage() {
      if (state.missedList.length === 0) {
        if (state.currentStage === 1) state.stage1Passed = true;
        if (state.currentStage === 2) state.stage2Passed = true;
        playSound('clear');

        // ステージ1・2ともにクリアしたら合格証へ自動遷移！
        if (state.stage1Passed && state.stage2Passed) {
          state.screen = 'certificate';
          render();
          return;
        }
      }
      state.screen = 'stage-result';
      render();
    }

      const toRetry = [...state.missedList];

    /* -------------------------------------------------------------------------
       画面G: 合格証（賞状・リアルタイム日時・画像ダウンロード）
       ------------------------------------------------------------------------- */
    function getFormattedNow() {
      const now = new Date();
      const y = now.getFullYear();
      const m = now.getMonth() + 1;
      const d = now.getDate();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      return `${y}年${m}月${d}日 ${hh}:${mm}`;
    }

    // 1〜4年配当漢字の読み辞書から、すべての単漢字と読みを統合登録し、1〜4年以外の漢字を除外する
    (() => {
      const allowedSet = new Set();
      G1_TO_G4_READINGS.forEach(([kanji]) => allowedSet.add(kanji));

      const isAllowedWord = (word) => {
        for (const ch of word) {
          if (/[\u4E00-\u9FFF\u3400-\u4DBF]/.test(ch) && !allowedSet.has(ch)) {
            return false;
          }
        }
        return true;
      };

      Object.keys(KANJI_DICT).forEach((reading) => {
        const filtered = KANJI_DICT[reading].filter(isAllowedWord);
        if (filtered.length > 0) {
          KANJI_DICT[reading] = filtered;
        } else {
          delete KANJI_DICT[reading];
        }
      });

      G1_TO_G4_READINGS.forEach(([kanji, readingsStr]) => {
        readingsStr.split(/\s+/).forEach((r) => {
          if (!r) return;
          if (!KANJI_DICT[r]) {
            KANJI_DICT[r] = [kanji];
          } else if (!KANJI_DICT[r].includes(kanji)) {
            KANJI_DICT[r].push(kanji);
          }
        });
      });
    })();

    const kbState = {
      bufferText: '',
      yomiStartIndex: 0,
      lastKeyId: null,
      lastTapTime: 0,
      toggleIndex: 0,
      touchStartX: 0,
      touchStartY: 0,
      activeKeyId: null,
      flickDirection: 'center'

    function openNameKeyboard() {
      playSound('tap');
      kbState.bufferText = state.studentName || '';
      kbState.yomiStartIndex = kbState.bufferText.length;
      kbState.lastKeyId = null;
      const modal = document.getElementById('kana-keyboard-modal');
      if (!modal) return;
      modal.classList.remove('hidden');
      renderKeyboardPanel();
    }

    function closeNameKeyboard(save) {
      playSound('tap');
      if (save) {
        state.studentName = kbState.bufferText.trim();
        render();
      }
      const modal = document.getElementById('kana-keyboard-modal');
      if (modal) modal.classList.add('hidden');
    }

    function getCurrentYomi() {
      if (kbState.yomiStartIndex > kbState.bufferText.length) {
        kbState.yomiStartIndex = kbState.bufferText.length;
      }
      return kbState.bufferText.slice(kbState.yomiStartIndex);
    }

    function getKanjiCandidates(yomi) {
      if (!yomi) return [];
      const results = [];
      const addUnique = (word) => {
        if (word && !results.includes(word)) results.push(word);
      };

      if (KANJI_DICT[yomi]) {
        KANJI_DICT[yomi].forEach(addUnique);
      }

      if (yomi.length >= 2) {
        Object.keys(KANJI_DICT).forEach((k) => {
          if (k.startsWith(yomi) && k !== yomi && results.length < 14) {
            KANJI_DICT[k].forEach(addUnique);
          }
        });
      }

      const katakana = yomi.replace(/[\u3041-\u3096]/g, (ch) =>
        String.fromCharCode(ch.charCodeAt(0) + 0x60)
      );
      if (katakana !== yomi) addUnique(katakana);
      addUnique(yomi);

      return results.slice(0, 18);
    }

    function applyKanjiCandidate(word) {
      playSound('tap');
      const prefix = kbState.bufferText.slice(0, kbState.yomiStartIndex);
      kbState.bufferText = prefix + word;
      kbState.yomiStartIndex = kbState.bufferText.length;
      kbState.lastKeyId = null;
      updateKeyboardDisplayOnly();
    }

    function handleKanaInput(keyObj, direction) {
      // 文字キー（「あ・か・さ…」「゛゜小」「空白・記号」）の入力は無音にする
      const now = Date.now();

      if (keyObj.isModifier) {
        kbState.lastKeyId = null;
        if (kbState.bufferText.length === 0) return;
        const lastChar = kbState.bufferText.slice(-1);
        const nextChar = CHAR_CYCLE_MAP[lastChar];
        if (nextChar) {
          kbState.bufferText = kbState.bufferText.slice(0, -1) + nextChar;
        }
        updateKeyboardDisplayOnly();
        return;
      }

      if (direction === 'center' && kbState.lastKeyId === keyObj.id && now - kbState.lastTapTime < 1100) {
        kbState.toggleIndex = (kbState.toggleIndex + 1) % keyObj.toggle.length;
        const ch = keyObj.toggle[kbState.toggleIndex];
        kbState.bufferText = kbState.bufferText.slice(0, -1) + ch;
      } else {
        const ch = keyObj.flick[direction] || keyObj.flick.center;
        if (kbState.bufferText.length >= 16) {
          showToast('16文字まで入力できます');
          return;
        }
        if (keyObj.id === 'sym') {
          kbState.bufferText += ch;
          kbState.yomiStartIndex = kbState.bufferText.length;
          kbState.lastKeyId = null;
          updateKeyboardDisplayOnly();
          return;
        }
        kbState.bufferText += ch;
        kbState.lastKeyId = direction === 'center' ? keyObj.id : null;
        kbState.toggleIndex = 0;
      }

      kbState.lastTapTime = now;
      updateKeyboardDisplayOnly();
    }

    function handleBackspace() {
      playSound('tap');
      kbState.lastKeyId = null;
      if (kbState.bufferText.length > 0) {
        kbState.bufferText = kbState.bufferText.slice(0, -1);
        if (kbState.yomiStartIndex > kbState.bufferText.length) {
          kbState.yomiStartIndex = kbState.bufferText.length;
        }
      }
      updateKeyboardDisplayOnly();
    }

    function handleClearAll() {
      playSound('tap');
      kbState.bufferText = '';
      kbState.yomiStartIndex = 0;
      kbState.lastKeyId = null;
      updateKeyboardDisplayOnly();
    }

    function updateKeyboardDisplayOnly() {
      const displayEl = document.getElementById('kb-display-text');
      const candContainer = document.getElementById('kb-candidates-bar');
      if (!displayEl || !candContainer) {
        renderKeyboardPanel();
        return;

      if (kbState.bufferText) {
        displayEl.innerHTML = `${escapeHtml(kbState.bufferText)}<span class="animate-pulse text-amber-500">|</span>`;
      } else {
        displayEl.innerHTML = `<span class="text-slate-400 text-base">ここに なまえが はいります</span>`;
      }

      const yomi = getCurrentYomi();
      const candidates = getKanjiCandidates(yomi);
      if (candidates.length > 0) {
        candContainer.innerHTML = candidates
          .map(
            (w) => `
            <button type="button" onclick="applyKanjiCandidate('${escapeHtml(w)}')"
              class="shrink-0 px-3 py-1 rounded-xl bg-amber-100 hover:bg-amber-200 border border-amber-400 text-amber-950 font-extrabold text-sm sm:text-base active:scale-95 transition">
              ${escapeHtml(w)}
            </button>`
          )
          .join('');
      } else {
        candContainer.innerHTML = `<span class="text-xs font-bold text-slate-400 px-2">ひらがなを 打つと 小1〜4の 漢字へんかん候補が出ます</span>`;
      }
    }

    function renderKeyboardPanel() {
      const modal = document.getElementById('kana-keyboard-modal');
      if (!modal) return;

      const yomi = getCurrentYomi();
      const candidates = getKanjiCandidates(yomi);

      const candidatesHtml =
        candidates.length > 0
          ? candidates

                (w) => `
              <button type="button" onclick="applyKanjiCandidate('${escapeHtml(w)}')"

                ${escapeHtml(w)}
              </button>`
              )
              .join('')
          : `<span class="text-xs font-bold text-slate-400 px-2">ひらがなを 打つと 小1〜4の 漢字へんかん候補が出ます</span>`;

      const keysGridHtml = KANA_KEYS.map(
        (k) => `
        <button type="button"
          data-key-id="${k.id}"
          class="kana-key-btn relative h-12 sm:h-14 rounded-2xl border-2 font-extrabold text-base sm:text-lg shadow-sm transition active:scale-95 flex flex-col items-center justify-center ${
            k.isModifier
              ? 'bg-amber-100 border-amber-300 text-amber-950 text-xs sm:text-sm'
              : 'bg-white border-yellow-300 text-slate-800 hover:bg-yellow-50'
          }">
          <span>${k.label}</span>
          ${
            !k.isModifier
              ? `<span class="text-[9px] text-slate-400 font-normal leading-none mt-0.5">${k.flick.left}・${k.flick.up}・${k.flick.right}・${k.flick.down}</span>`
              : ''
          }
        </button>`
      ).join('');

      modal.innerHTML = `
        <div class="w-full max-w-md bg-[#fffef8] border-4 border-yellow-400 rounded-3xl shadow-2xl p-3 sm:p-4 flex flex-col gap-2.5 relative">
          <!-- ヘッダー -->
          <div class="flex items-center justify-between">
            <span class="text-xs font-extrabold text-amber-900 bg-yellow-200 px-2.5 py-0.5 rounded-full">
              なまえ入力パネル（タップ＆フリック対応）
            </span>
            <button type="button" onclick="closeNameKeyboard(false)"
              class="text-xs font-bold text-slate-500 hover:text-slate-800 px-2 py-1">
              とじる ✕
            </button>
          </div>

          <!-- 入力テキスト表示欄 -->
          <div class="flex items-center gap-2 bg-white border-2 border-amber-400 rounded-2xl px-3 py-2 min-h-[46px]">
            <div id="kb-display-text" class="flex-1 font-extrabold text-xl text-slate-800 tracking-wide overflow-x-auto whitespace-nowrap">
              ${
                kbState.bufferText
                  ? `${escapeHtml(kbState.bufferText)}<span class="animate-pulse text-amber-500">|</span>`
                  : '<span class="text-slate-400 text-base">ここに なまえが はいります</span>'
              }
            </div>
            <button type="button" onclick="handleClearAll()"
              class="text-xs font-bold px-2 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600">
              全消し
            </button>
          </div>

          <!-- 漢字・カタカナ変換候補バー -->
          <div id="kb-candidates-bar" class="flex items-center gap-1.5 overflow-x-auto py-1 px-1 bg-yellow-50 rounded-xl border border-yellow-200 min-h-[40px]">
            ${candidatesHtml}
          </div>

          <!-- テンキー配列 + 右側操作列 -->
          <div class="grid grid-cols-4 gap-1.5 sm:gap-2">
            <div class="col-span-3 grid grid-cols-3 gap-1.5 sm:gap-2">
              ${keysGridHtml}
            </div>
            <div class="col-span-1 flex flex-col gap-1.5 sm:gap-2">
              <button type="button" onclick="handleBackspace()"
                class="flex-1 rounded-2xl bg-rose-100 hover:bg-rose-200 border-2 border-rose-300 text-rose-900 font-extrabold text-sm sm:text-base shadow-sm active:scale-95 transition flex items-center justify-center">
                ⌫ けす
              </button>
              <button type="button" onclick="closeNameKeyboard(true)"
                class="flex-[2] rounded-2xl bg-emerald-500 hover:bg-emerald-600 border-b-4 border-emerald-700 text-white font-extrabold text-base sm:text-lg shadow-md active:scale-95 transition flex flex-col items-center justify-center">
                <span>決定</span>
                <span class="text-[10px] font-bold opacity-90">OK</span>
              </button>
            </div>
          </div>

          <!-- フリックガイド吹き出し -->
          <div id="flick-bubble" class="flick-bubble hidden px-3 py-1.5 rounded-2xl bg-amber-600 text-white font-extrabold text-xl shadow-lg border-2 border-white"></div>
        </div>
      `;

      attachKanaKeyEvents();
    }

    function attachKanaKeyEvents() {
      const buttons = document.querySelectorAll('.kana-key-btn');
      const bubble = document.getElementById('flick-bubble');

      buttons.forEach((btn) => {
        const keyId = btn.getAttribute('data-key-id');
        const keyObj = KANA_KEYS.find((k) => k.id === keyId);
        if (!keyObj) return;

        let pointerActive = false;
        let startX = 0;
        let startY = 0;
        let currentDir = 'center';

        const getDirection = (dx, dy) => {
          const threshold = 22;
          if (Math.abs(dx) < threshold && Math.abs(dy) < threshold) return 'center';
          if (Math.abs(dx) > Math.abs(dy)) {
            return dx < 0 ? 'left' : 'right';
          } else {
            return dy < 0 ? 'up' : 'down';
          }
        };

        const showBubble = (dir) => {
          if (!bubble || keyObj.isModifier) return;
          const ch = keyObj.flick[dir] || keyObj.flick.center;
          const rect = btn.getBoundingClientRect();
          const modalBox = btn.closest('.max-w-md').getBoundingClientRect();
          bubble.textContent = ch === '　' ? '空白' : ch;
          bubble.style.left = `${rect.left - modalBox.left + rect.width / 2}px`;
          bubble.style.top = `${rect.top - modalBox.top}px`;
          bubble.classList.remove('hidden');
        };

        const hideBubble = () => {
          if (bubble) bubble.classList.add('hidden');
        };

        btn.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          pointerActive = true;
          startX = e.clientX;
          startY = e.clientY;
          currentDir = 'center';
          btn.setPointerCapture(e.pointerId);
          showBubble('center');
        });

        btn.addEventListener('pointermove', (e) => {
          if (!pointerActive) return;
          const dx = e.clientX - startX;
          const dy = e.clientY - startY;
          currentDir = getDirection(dx, dy);
          showBubble(currentDir);
        });

        const finishPointer = () => {
          if (!pointerActive) return;
          pointerActive = false;
          hideBubble();
          handleKanaInput(keyObj, currentDir);
        };

        btn.addEventListener('pointerup', finishPointer);
        btn.addEventListener('pointercancel', () => {
          pointerActive = false;
          hideBubble();
        });
      });
    }

    /* =========================================================================
       7. 合格証の画像保存（html2canvas + フォールバック描画）
       ========================================================================= */
    async function downloadCertificate() {
      playSound('tap');
      const captureEl = document.getElementById('certificate-capture');
      if (!captureEl) return;

      const unit = getSelectedUnitData();
      const gradeLabel = CURRICULUM[state.selectedGrade].shortLabel;
      const fileName = `合格証_${gradeLabel}_${unit.title}.png`;

      try {
        if (typeof html2canvas !== 'undefined') {
          const canvas = await html2canvas(captureEl, {
            scale: 2,
            backgroundColor: '#fffdf7',
            useCORS: true
          });
          const link = document.createElement('a');
          link.download = fileName;
          link.href = canvas.toDataURL('image/png');
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          showToast('合格証の画像を保存しました！');
          return;
        }
      } catch (err) {
        console.warn('html2canvas fallback:', err);
      }

      try {
        const canvas = document.createElement('canvas');
        canvas.width = 1000;
        canvas.height = 680;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fffdf7';
        ctx.fillRect(0, 0, 1000, 680);
        ctx.strokeStyle = '#d97706';
        ctx.lineWidth = 14;
        ctx.strokeRect(24, 24, 952, 632);

        ctx.fillStyle = '#92400e';
        ctx.font = 'bold 54px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('合 格 証', 500, 130);

        ctx.fillStyle = '#1e293b';
        ctx.font = 'bold 34px sans-serif';
        const dispName = state.studentName ? `${state.studentName} さん` : 'よくがんばった あなたへ';
        ctx.fillText(dispName, 500, 220);

        ctx.font = 'bold 28px sans-serif';
        ctx.fillText(`${gradeLabel}「${unit.title}」`, 500, 310);
        ctx.fillText('すべてのステージに 合格しました！', 500, 370);

        ctx.fillStyle = '#b45309';
        ctx.font = 'bold 22px sans-serif';
        ctx.fillText(`達成日時：${getFormattedNow()}`, 500, 560);

        const link = document.createElement('a');
        link.download = fileName;
        link.href = canvas.toDataURL('image/png');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('合格証の画像を保存しました！');
      } catch (e) {
        showToast('画像の保存に失敗しました。スクリーンショットで保存してね。');
      }
    }

    /* =========================================================================
       8. 初期起動処理
       ========================================================================= */
    window.addEventListener('DOMContentLoaded', () => {
      render();
    });
  </script>
